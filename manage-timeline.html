<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Timeline | Aninda Sadman</title>
  <link rel="stylesheet" href="timeline.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <p class="eyebrow">Content management</p>
      <h1>Manage Timeline</h1>
      <p>Add, edit, or remove timeline updates in this browser. When finished, download the JSON file and replace <code>data/timeline.json</code> in the repository before deploying.</p>
      <div class="actions">
        <a class="btn btn-secondary" href="timeline.html">View Timeline</a>
        <a class="btn btn-secondary" href="index.html">Back to portfolio</a>
      </div>
    </header>

    <section class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading">Add an update</h2>
      <form id="timeline-form">
        <label for="title">Title <input id="title" name="title" required maxlength="160" /></label>
        <label for="description">Description <textarea id="description" name="description" required maxlength="2000"></textarea></label>
        <label for="date">Date <input id="date" name="date" type="date" required /></label>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit" id="save-button">Add update</button>
          <button class="btn btn-secondary" type="button" id="cancel-button" hidden>Cancel edit</button>
          <button class="btn btn-secondary" type="button" id="download-button">Download timeline.json</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-heading">
      <h2 id="list-heading">Current updates</h2>
      <div id="manager-list" aria-live="polite"><p>Loading timeline…</p></div>
    </section>
    <footer>© <span id="year"></span> Aninda Sadman</footer>
  </main>
  <script src="timeline.js"></script>
  <script>
    const state = { entries: [], editingIndex: null };
    const form = document.getElementById("timeline-form");
    const titleInput = document.getElementById("title");
    const descriptionInput = document.getElementById("description");
    const dateInput = document.getElementById("date");
    const saveButton = document.getElementById("save-button");
    const cancelButton = document.getElementById("cancel-button");
    const status = document.getElementById("status");

    document.getElementById("year").textContent = new Date().getFullYear();

    function setStatus(message) {
      status.textContent = message;
    }

    function resetForm() {
      form.reset();
      state.editingIndex = null;
      saveButton.textContent = "Add update";
      cancelButton.hidden = true;
      document.getElementById("form-heading").textContent = "Add an update";
    }

    function refreshList() {
      timelineApp.renderManager(state.entries, (index) => {
        const entry = state.entries[index];
        state.editingIndex = index;
        titleInput.value = entry.title;
        descriptionInput.value = entry.description;
        dateInput.value = entry.date;
        saveButton.textContent = "Save changes";
        cancelButton.hidden = false;
        document.getElementById("form-heading").textContent = "Edit update";
        titleInput.focus();
      }, (index) => {
        if (!window.confirm("Delete this timeline update?")) return;
        state.entries.splice(index, 1);
        resetForm();
        refreshList();
        setStatus("Update deleted. Download the JSON file to save this change.");
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const entry = {
        title: titleInput.value.trim(),
        description: descriptionInput.value.trim(),
        date: dateInput.value
      };
      if (!entry.title || !entry.description || !/^\d{4}-\d{2}-\d{2}$/.test(entry.date)) {
        setStatus("Please provide a title, description, and valid date.");
        return;
      }
      if (state.editingIndex === null) state.entries.push(entry);
      else state.entries[state.editingIndex] = entry;
      state.entries = timelineApp.cleanEntries(state.entries);
      resetForm();
      refreshList();
      setStatus("Update saved in this browser. Download timeline.json to publish it.");
    });

    cancelButton.addEventListener("click", () => { resetForm(); setStatus("Edit cancelled."); });

    document.getElementById("download-button").addEventListener("click", () => {
      const blob = new Blob([`${JSON.stringify(state.entries, null, 2)}\n`], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "timeline.json";
      link.click();
      URL.revokeObjectURL(url);
      setStatus("timeline.json downloaded. Replace data/timeline.json with it and commit the change.");
    });

    timelineApp.loadEntries().then((entries) => {
      state.entries = entries;
      refreshList();
    }).catch((error) => {
      state.entries = [];
      refreshList();
      setStatus(`${error.message} Starting with an empty list.`);
    });
  </script>
</body>
</html>
